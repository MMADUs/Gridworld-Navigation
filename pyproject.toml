[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classical-rl-playground"
version = "0.1.0"
description = "A from-scratch classical reinforcement learning playground"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["environment*", "experiments*", "algorithms*"]
